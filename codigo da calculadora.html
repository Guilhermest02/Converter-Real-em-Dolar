<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Moedas</title>
</head>
<body>

    <h2>Conversor de Reais para Dólar</h2>

    <script>
        let valor = Number(prompt("Digite o valor em reais:"));
        let dolar = valor / 5.30;

        document.write("Valor em dólares: US$ " + dolar.toFixed(2));
    </script>

</body>
</html>
